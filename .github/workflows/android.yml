name: Android verification

on:
  push:
    branches: [feature/mock-dashboard-foundation]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Verify JDK, Gradle and Android SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Verify versions and generate official wrapper
        id: wrapper
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          mkdir -p "$RUNNER_TEMP/wrapper-bootstrap"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$RUNNER_TEMP/wrapper-bootstrap/settings.gradle.kts"
          gradle --no-daemon --project-dir "$RUNNER_TEMP/wrapper-bootstrap" wrapper \
            --gradle-version 9.6.0 --distribution-type bin \
            --gradle-distribution-sha256-sum bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          cd "$RUNNER_TEMP/wrapper-bootstrap"
          printf '%s  %s\n' '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          ./gradlew --version
      - name: Install compile SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=0 | grep -E 'platforms;android-|build-tools;36\.'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Upload generated wrapper
        if: ${{ always() && steps.wrapper.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolchain-bootstrap
          path: |
            ${{ runner.temp }}/wrapper-bootstrap/gradlew
            ${{ runner.temp }}/wrapper-bootstrap/gradlew.bat
            ${{ runner.temp }}/wrapper-bootstrap/gradle/wrapper/
          if-no-files-found: error
          retention-days: 7
      - name: Run module unit tests
        if: ${{ hashFiles('settings.gradle.kts') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --no-daemon :vehicle-core:test :vehicle-mock:test :app:testDebugUnitTest
      - name: Build application and check Android compatibility
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && hashFiles('settings.gradle.kts') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Retain build evidence
        if: ${{ always() && hashFiles('settings.gradle.kts') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-evidence
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            vehicle-core/build/reports/
            vehicle-core/build/test-results/
            vehicle-mock/build/reports/
            vehicle-mock/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  emulator:
    name: Runtime API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            image: 'system-images;android-29;google_apis;x86_64'
            gpu: swiftshader_indirect
          - api: 37
            image: 'system-images;android-37.0;google_apis;x86_64'
            gpu: swangle_indirect
    env:
      ANDROID_USER_HOME: /tmp/seal-dashboard-android
      ANDROID_AVD_HOME: /tmp/seal-dashboard-avd
    steps:
      - name: Check out feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          cache-read-only: false
      - name: Install and boot an isolated emulator
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" evidence
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=0 | grep -E 'system-images;android-(29|37)' > evidence/available-images.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'emulator' '${{ matrix.image }}'
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n seal-dashboard-test -k '${{ matrix.image }}' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd seal-dashboard-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu "${{ matrix.gpu }}" -no-metrics -memory 2048 -partition-size 4096 > evidence/emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          # boot_completed can survive a crashing graphics-service restart loop.
          adb logcat -d -b crash > evidence/boot-crashes.txt
          if grep -q 'hasReadColorBufferDma' evidence/boot-crashes.txt; then
            echo 'Emulator guest mapper compatibility failure before app installation' >&2
            exit 1
          fi
          adb shell service check package | grep -q 'found'
          adb shell service check window | grep -q 'found'
          adb shell input keyevent 82
          adb shell wm size 1920x1080
          adb shell wm density 160
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | tee evidence/runtime-api.txt
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '${{ matrix.api }}'
          adb shell df -h /data | tee evidence/guest-storage.txt
      - name: Install and launch APK
        if: ${{ steps.boot.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug
          adb shell df -h /data | tee evidence/pre-install-storage.txt
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n io.github.jhaago.sealdashboard/.MainActivity
          adb exec-out screencap -p > evidence/launch.png
      - name: Run Compose runtime tests
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test_status=0
          ./gradlew --no-daemon :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=io.github.jhaago.sealdashboard.ui.ProcessBoundaryTest || test_status=$?
          report_status=0
          python - <<'PY' || report_status=$?
          import glob, sys, xml.etree.ElementTree as ET
          tests = failures = skipped = 0
          paths = glob.glob("app/build/outputs/androidTest-results/connected/debug/TEST-*.xml")
          for path in paths:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              for case in root.iter("testcase"):
                  issues = list(case.iter("failure")) + list(case.iter("error"))
                  print(case.get("classname"), case.get("name"), "FAILED" if issues else "PASSED")
                  for issue in issues:
                      print("".join(issue.itertext())[:1800])
          print(f"Runtime evidence: {tests} tests, {failures} failures/errors, {skipped} skipped")
          if tests < 29 or failures or skipped:
              sys.exit("Incomplete or failed runtime evidence; Gradle success alone is insufficient")
          PY
          test "$test_status" -eq 0
          test "$report_status" -eq 0
      - name: Verify process restart preserves only display preferences
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -r -e class io.github.jhaago.sealdashboard.ui.DashboardProcessTest#prepareForProcessRestart \
            io.github.jhaago.sealdashboard.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/process-seed.txt
          adb shell am force-stop io.github.jhaago.sealdashboard
          adb shell am instrument -w -r -e class io.github.jhaago.sealdashboard.ui.DashboardProcessTest#freshProcessRestoresOnlyDisplayPreferences \
            io.github.jhaago.sealdashboard.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/process-restart.txt
          python - <<'PYPROCESS'
          from pathlib import Path
          import re
          for name in ('process-seed', 'process-restart'):
              output = Path('evidence/' + name + '.txt').read_text()
              if not re.search(r'^OK \(1 test\)$', output, re.M) or 'FAILURES!!!' in output:
                  raise SystemExit(name + ': missing successful process-boundary evidence')
          print('Both process-boundary phases passed in separate processes')
          PYPROCESS
      - name: Retain runtime evidence
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p evidence
          adb logcat -d > evidence/logcat.txt 2>&1 || true
          adb pull /sdcard/Pictures/SealDashboardEvaluation evidence/screenshots || true
          adb emu kill || true
      - name: Expose deterministic visual review evidence
        if: ${{ always() && steps.boot.outcome == 'success' && matrix.api == 29 }}
        shell: bash
        run: |
          python - <<'PYVISUAL'
          import base64, struct
          from pathlib import Path
          # These prefixes are the persisted public style names used by screenshot fixtures.
          names = [f'{style}-assistant-{mode}.png'
                   for style in ('modern', 'legacy_hmi', 'futuristic')
                   for mode in ('parked', 'driving', 'compact-driving')]
          for name in names:
              path = Path('evidence/screenshots') / name
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('Invalid screenshot ' + name)
              width, height = struct.unpack('>II', data[16:24])
              print(f'VISUAL_EVIDENCE_BEGIN {name} {width} {height}')
              encoded = base64.b64encode(data).decode('ascii')
              for offset in range(0, len(encoded), 4000):
                  print('VISUAL_EVIDENCE_DATA ' + encoded[offset:offset+4000])
              print('VISUAL_EVIDENCE_END ' + name)
          PYVISUAL
      - name: Upload runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-api-${{ matrix.api }}
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
