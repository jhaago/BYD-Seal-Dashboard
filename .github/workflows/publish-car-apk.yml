name: Publish car-test APK

on:
  push:
    branches:
      - test/car-apk-install
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: test/car-apk-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publish APK to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/BYD-Seal-Dashboard-debug.apk
          sha256sum downloads/BYD-Seal-Dashboard-debug.apk > downloads/BYD-Seal-Dashboard-debug.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/BYD-Seal-Dashboard-debug.apk downloads/BYD-Seal-Dashboard-debug.apk.sha256
          if git diff --cached --quiet; then
            echo 'APK is unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m 'chore: publish car-test APK [apk-publish]'
          git push origin HEAD:test/car-apk-install
